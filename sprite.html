<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Sprite Sandbox</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background-color: #151515;
      border: 2px solid #333;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <canvas id="sandboxCanvas"></canvas>

  <script>
    const canvas = document.getElementById('sandboxCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 32;

    // ── SPRITE DEFINITIONS ─────────────────────────────────────
    // Each sprite's draw(ctx, originX, originY, pixel) mirrors the pixel art
    // used in dinosurvivor-map-module-vanilla-js.html exactly.
    //
    // `pixel` = 1 grid unit here (ctx.scale handles screen sizing).
    // In the game module pixel = 3 — same shapes, different base unit.
    //
    // CHANGED: all draw functions rewritten this session to match the game
    // module's naming and pixel layout:
    //   - originX/originY instead of implicit x/y from sprite object
    //   - centerX/centerY and trunkX/trunkY instead of inline offsets
    //   - no sine pulsing (removed per user request)
    //   - glow and hint border commented out (see below)
    const sprites = [

      // ── Gatherable Rock ───────────────────────────────────────
      {
        type: 'gatherable_rock',
        gridX: 6,
        gridY: 18,
        draw(ctx, originX, originY, pixel) {
          const centerX = originX + pixel;
          const centerY = originY + pixel;

          // Base — #7A85A9
          ctx.fillStyle = '#7A85A9';
          ctx.fillRect(centerX - pixel, centerY - pixel, pixel * 3, pixel * 3);

          // Veins — #4C4C67
          ctx.fillStyle = '#4C4C67';
          ctx.fillRect(centerX, centerY, pixel, pixel);
          ctx.fillRect(centerX - pixel, centerY - pixel, pixel, pixel);
          ctx.fillRect(centerX + pixel, centerY + pixel, pixel, pixel);

          // ── Interactivity hint ────────────────────────────────
          // CHANGED: was active in original file.
          // Commented out — enable in Phase 3 when MC proximity
          // detection is wired up (see dinosurvivor-game-plan-v3.md §3.2).
          // ctx.fillStyle = 'rgba(255, 255, 0, 0.15)';
          // ctx.fillRect(centerX - pixel * 2, centerY - pixel * 2, pixel * 5, pixel * 5);
          // ctx.strokeStyle = 'rgba(255,255,180,0.85)';
          // ctx.lineWidth = 2;
          // ctx.strokeRect(originX, originY, pixel * 3, pixel * 3);
        }
      },

      // ── Tree ──────────────────────────────────────────────────
      {
        type: 'tree',
        gridX: 18,
        gridY: 10,
        draw(ctx, originX, originY, pixel) {
          const trunkX = originX + pixel * 2;
          const trunkY = originY + pixel * 3;

          // Trunk — #8B4513
          ctx.fillStyle = '#8B4513';
          ctx.fillRect(trunkX, trunkY + pixel, pixel, pixel);

          // Canopy — #228B22 (wide mid band + top spike)
          ctx.fillStyle = '#228B22';
          ctx.fillRect(trunkX - pixel * 2, trunkY - pixel * 2, pixel * 5, pixel * 3);
          ctx.fillRect(trunkX - pixel, trunkY - pixel * 3, pixel * 3, pixel);

          // ── Interactivity hint ────────────────────────────────
          // CHANGED: was active in original file.
          // Commented out — enable in Phase 3 when MC proximity
          // detection is wired up (see dinosurvivor-game-plan-v3.md §3.2).
          // ctx.fillStyle = 'rgba(255, 255, 0, 0.15)';
          // ctx.fillRect(trunkX - pixel * 3, trunkY - pixel * 4, pixel * 7, pixel * 8);
          // ctx.strokeStyle = 'rgba(255,255,180,0.85)';
          // ctx.lineWidth = 2;
          // ctx.strokeRect(originX, originY, pixel * 5, pixel * 6);
        }
      },

      // ── Berry Bush ────────────────────────────────────────────
      {
        type: 'berry_bush',
        gridX: 24,
        gridY: 24,
        draw(ctx, originX, originY, pixel) {
          const centerX = originX + pixel * 2;
          const centerY = originY + pixel;

          // Bush body — #228B22
          ctx.fillStyle = '#228B22';
          ctx.fillRect(centerX - pixel * 2, centerY - pixel, pixel * 3, pixel * 3);

          // Berries — #FF0000 (solid, no pulse)
          // CHANGED: was rgba(255,0,0, sineValue) — sine pulse removed per user request.
          ctx.fillStyle = '#FF0000';
          ctx.fillRect(centerX - pixel, centerY - pixel, pixel, pixel);
          ctx.fillRect(centerX - pixel * 2, centerY, pixel, pixel);
          ctx.fillRect(centerX, centerY + pixel, pixel, pixel);

          // ── Interactivity hint ────────────────────────────────
          // CHANGED: was active in original file.
          // Commented out — enable in Phase 3 when MC proximity
          // detection is wired up (see dinosurvivor-game-plan-v3.md §3.2).
          // ctx.fillStyle = 'rgba(255, 255, 0, 0.15)';
          // ctx.fillRect(centerX - pixel * 3, centerY - pixel * 2, pixel * 5, pixel * 5);
          // ctx.strokeStyle = 'rgba(255,255,180,0.85)';
          // ctx.lineWidth = 2;
          // ctx.strokeRect(originX, originY, pixel * 3, pixel * 3);
        }
      },

      // ── Metal Node ────────────────────────────────────────────
      {
        type: 'metal_node',
        gridX: 12,
        gridY: 28,
        draw(ctx, originX, originY, pixel) {
          const centerX = originX + pixel;
          const centerY = originY + pixel;

          // Base — #272735
          ctx.fillStyle = '#272735';
          ctx.fillRect(centerX - pixel, centerY - pixel, pixel * 3, pixel * 3);

          // Veins — #4C4C67
          ctx.fillStyle = '#4C4C67';
          ctx.fillRect(centerX, centerY, pixel, pixel);
          ctx.fillRect(centerX - pixel, centerY - pixel, pixel, pixel);
          ctx.fillRect(centerX + pixel, centerY + pixel, pixel, pixel);

          // Sparkle — static #FFFFFF at top-left pixel of node.
          // CHANGED: was blinking (Math.floor(time/500)%2), then sine pulsing.
          // Both removed per user request. Animate via timestamp in game when ready.
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(centerX - pixel, centerY - pixel, pixel, pixel);

          // ── Interactivity hint ────────────────────────────────
          // CHANGED: was active in original file.
          // Commented out — enable in Phase 3 when MC proximity
          // detection is wired up (see dinosurvivor-game-plan-v3.md §3.2).
          // ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
          // ctx.fillRect(centerX - pixel * 2, centerY - pixel * 2, pixel * 5, pixel * 5);
          // ctx.strokeStyle = 'rgba(180,180,255,0.9)';
          // ctx.lineWidth = 2;
          // ctx.strokeRect(originX, originY, pixel * 3, pixel * 3);
        }
      }];

    // ── RENDER ─────────────────────────────────────────────────
    // CHANGED: draw() now receives `pixel` as a param (was implicit via
    // PIXEL_SCALE). pixel=1 grid unit here; ctx.scale(pixelScale) handles
    // the rest. Keeps the signature consistent with the game module
    // where pixel=3 is the base unit.
    function render() {
      const minDimension = Math.min(window.innerWidth, window.innerHeight);
      const size = minDimension > 0 ? Math.floor(minDimension * 0.95): 800;
      canvas.width = size;
      canvas.height = size;
      const pixelScale = canvas.width / GRID_SIZE;

      ctx.fillStyle = '#151515';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath(); ctx.moveTo(i * pixelScale, 0); ctx.lineTo(i * pixelScale, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * pixelScale); ctx.lineTo(canvas.width, i * pixelScale); ctx.stroke();
      }

      // Draw all sprites inside scaled context
      ctx.save();
      ctx.scale(pixelScale, pixelScale);
      for (const sprite of sprites) {
        sprite.draw(ctx, sprite.gridX, sprite.gridY, 1);
      }
      ctx.restore();
    }

    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
