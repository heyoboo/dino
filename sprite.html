<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Sprite Sandbox</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background-color: #151515;
      border: 2px solid #333;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <canvas id="sandboxCanvas"></canvas>

  <script>
    const canvas = document.getElementById('sandboxCanvas');
    const ctx = canvas.getContext('2d');
    const GRID_SIZE = 32;

    // --- SPRITE DEFINITIONS (Object Array) ---
    const sprites = [
      // Resource Sprites
      {
        type: "gatherable_rock",
        x: 6,
        y: 18,
        color: "#7A85A9",
        veinColor: "#4C4C67",
        glowColor: "rgba(255, 255, 0, 0.15)",
        width: 3,
        height: 3,
        isResource: true,
        draw: function(ctx) {
          // Base rock
          ctx.fillStyle = this.color;
          ctx.fillRect(this.x - 1, this.y - 1, this.width, this.height);
          // Veins
          ctx.fillStyle = this.veinColor;
          ctx.fillRect(this.x, this.y, 1, 1);
          ctx.fillRect(this.x - 1, this.y - 1, 1, 1);
          ctx.fillRect(this.x + 1, this.y + 1, 1, 1);
          // Glow
          ctx.fillStyle = this.glowColor;
          ctx.fillRect(this.x - 2, this.y - 2, this.width + 2, this.height + 2);
        }
      },
      {
        type: "tree",
        x: 18,
        y: 10,
        trunkColor: "#8B4513",
        leafColor: "#228B22",
        glowColor: "rgba(255, 255, 0, 0.15)",
        width: 5,
        height: 6,
        isResource: true,
        draw: function(ctx) {
          // Trunk
          ctx.fillStyle = this.trunkColor;
          ctx.fillRect(this.x, this.y + 1, 1, 1);
          // Leaves
          ctx.fillStyle = this.leafColor;
          ctx.fillRect(this.x - 2, this.y - 2, this.width, 3);
          ctx.fillRect(this.x - 1, this.y - 3, 3, 1);
          // Glow
          ctx.fillStyle = this.glowColor;
          ctx.fillRect(this.x - 3, this.y - 4, this.width + 2, this.height + 1);
        }
      },
      {
        type: "berry_bush",
        x: 24,
        y: 24,
        bushColor: "#228B22",
        berryColor: "#FF0000",
        glowColor: "rgba(255, 255, 0, 0.15)",
        width: 3,
        height: 3,
        isResource: true,
        draw: function(ctx) {
          // Bush
          ctx.fillStyle = this.bushColor;
          ctx.fillRect(this.x - 2, this.y - 1, 3, 3);
          // Berries
          ctx.fillStyle = this.berryColor;
          ctx.fillRect(this.x - 1, this.y - 1, 1, 1);
          ctx.fillRect(this.x - 2, this.y, 1, 1);
          ctx.fillRect(this.x, this.y + 1, 1, 1);
          // Glow
          ctx.fillStyle = this.glowColor;
          ctx.fillRect(this.x - 3, this.y - 2, this.width + 2, this.height + 2);
        }
      },
      {
        type: "metal_node",
        x: 12,
        y: 28,
        baseColor: "#272735",
        veinColor: "#4C4C67",
        sparkleColor: "#FFFFFF",
        glowColor: "rgba(255, 255, 255, 0.15)",
        width: 3,
        height: 3,
        isResource: true,
        draw: function(ctx) {
          // Base
          ctx.fillStyle = this.baseColor;
          ctx.fillRect(this.x - 1, this.y - 1, this.width, this.height);
          // Veins
          ctx.fillStyle = this.veinColor;
          ctx.fillRect(this.x, this.y, 1, 1);
          ctx.fillRect(this.x - 1, this.y - 1, 1, 1);
          ctx.fillRect(this.x + 1, this.y + 1, 1, 1);
          // Sparkle
          ctx.fillStyle = this.sparkleColor;
          ctx.fillRect(this.x - 1, this.y - 1, 1, 1);
          // Glow
          ctx.fillStyle = this.glowColor;
          ctx.fillRect(this.x - 2, this.y - 2, this.width + 2, this.height + 2);
        }
      }];

    function render() {
      const minDimension = Math.min(window.innerWidth, window.innerHeight);
      const size = minDimension > 0 ? Math.floor(minDimension * 0.95): 800;
      canvas.width = size;
      canvas.height = size;
      const PIXEL_SCALE = canvas.width / GRID_SIZE;

      // Clear canvas
      ctx.fillStyle = '#151515';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * PIXEL_SCALE, 0);
        ctx.lineTo(i * PIXEL_SCALE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * PIXEL_SCALE);
        ctx.lineTo(canvas.width, i * PIXEL_SCALE);
        ctx.stroke();
      }

      // Draw all sprites
      ctx.save();
      ctx.scale(PIXEL_SCALE, PIXEL_SCALE);
      sprites.forEach(sprite => sprite.draw(ctx));
      ctx.restore();
    }

    window.addEventListener('resize', render);
    render();
  </script>
</body>
</html>
